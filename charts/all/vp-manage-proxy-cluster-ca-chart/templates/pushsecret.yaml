# create external secret which creates an aggregated configmap from all the certs in vault under pushsecrets/".*-aggregate$"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ca-aggregate
  namespace: openshift-config
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ca-aggregate
    creationPolicy: Owner
    deletionPolicy: Retain
    manifest:
      apiVersion: v1
      kind: ConfigMap
    template:
      mergePolicy: Merge
      engineVersion: v2
      data:
        ca-bundle.crt: |
{{ `{{- $all := list -}}
{{- range $k, $v := . }}
{{- if kindIs "string" $v }}
{{- $pem := $v }}
{{- if hasPrefix $pem "{" }}
{{- $pem = index (fromJson $v) "cert" | default "" }}
{{- end }}
{{- $certs := list }}
{{- if $pem }}
{{- $certs = regexFindAll "(?s)-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----" $pem -1 }}
{{- end }}
{{- if not $certs }}
{{- $certs = regexFindAll "(?s)-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----" $v -1 }}
{{- end }}
{{- range $certs }}
{{- $all = append $all . }}
{{- end }}
{{- end }}
{{- end }}
{{- range $all | uniq -}}
{{ . | replace "\\n" "\n" }}
{{- end }}
  ` | indent 10 }}
  dataFrom:
    - find:
        path: pushsecrets
        name:
          regexp: ".*-aggregate$"


