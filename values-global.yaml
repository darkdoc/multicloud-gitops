---
global:
  pattern: multicloud-gitops
  singleArgoCD: true
  options:
    useCSV: false
    syncPolicy: Automatic
    installPlanApproval: Automatic
main:
  variant: hub
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: "0.9.*"
  subPatterns:
    aap-starter:
      repoURL: https://github.com/validatedpatterns/aap-starter-kit
      targetRevision: main
    mcg-acm:
      repoURL: https://github.com/darkdoc/multicloud-gitops.git